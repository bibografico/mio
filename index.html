<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hozono Global | Módulo de Revisiones Industriales</title>
    <!-- Carga de Tailwind CSS via CDN para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fuente Inter de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Configuraciones de estilo generales */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }
        /* Animación simple de entrada */
        .animate-fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Animación para el panel de feedback */
        .animate-slide-up {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- HEADER LOGO MOCKUP -->
    <div class="absolute top-4 left-4 flex items-center gap-2 opacity-50">
        <!-- SVG del Escudo (Shield icon, similar a Lucide) -->
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 text-blue-900"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="font-bold text-blue-900 tracking-wider">HOZONO GLOBAL | PRL</span>
    </div>

    <!-- Contenedor principal de la aplicación -->
    <div id="app-container" class="max-w-md w-full">
        <!-- El contenido se cargará aquí por JavaScript -->
    </div>

    <script>
        // --- DATA SOURCE (Mismo que en React) ---
        const QUIZ_DATA = [
            // --- BLOQUE 1: PERIODICIDADES ---
            {
                id: 1,
                type: 'frequency',
                category: 'Sistemas de Seguridad',
                question: '¿Con qué frecuencia debemos revisar la Alarma y los pulsadores de emergencia?',
                options: [
                    { text: 'Trimestral', correct: false },
                    { text: 'Anual', correct: true },
                    { text: 'Quinquenal', correct: false }
                ],
                explanation: 'Correcto. La revisión de alarmas y pulsadores es ANUAL según la normativa de revisiones periódicas.'
            },
            {
                id: 2,
                type: 'frequency',
                category: 'Incendios',
                question: 'Respecto al Sistema contra incendios (extintores, central, sirena), existen dos revisiones. ¿Cuáles son?',
                options: [
                    { text: 'Solo Anual', correct: false },
                    { text: 'Mensual y Semestral', correct: false },
                    { text: 'Trimestral y Anual', correct: true }
                ],
                explanation: 'Exacto. Existe una revisión Trimestral básica y una revisión Anual más exhaustiva.'
            },
            {
                id: 3,
                type: 'frequency',
                category: 'Electricidad (OCA)',
                question: '¿Cada cuánto tiempo se pasa la OCA de Instalación Eléctrica de Baja Tensión?',
                options: [
                    { text: 'Cada año', correct: false },
                    { text: 'Quinquenal (Cada 5 años)', correct: true },
                    { text: 'Cada 10 años', correct: false }
                ],
                explanation: 'Muy bien. La OCA de Baja Tensión es Quinquenal, a diferencia de la Alta Tensión que es Anual.'
            },
            {
                id: 4,
                type: 'frequency',
                category: 'Elevación',
                question: 'Tenemos un ascensor en el centro. ¿Cada cuánto debe pasar la revisión OCA?',
                options: [
                    { text: 'Anual', correct: false },
                    { text: 'Bienal (Cada 2 años)', correct: true },
                    { text: 'Quinquenal', correct: false }
                ],
                explanation: 'Correcto. Los ascensores requieren una inspección OCA de carácter Bienal.'
            },
            // --- BLOQUE 2: PROCEDIMIENTOS ---
            {
                id: 5,
                type: 'scenario',
                category: 'Gestión',
                question: 'El Dpto. de Prevención te ha enviado el listado del estado de las revisiones de tu centro. ¿Cuál es tu primer paso como Jefe de Proyecto?',
                options: [
                    { text: 'Archivarlo hasta final de año.', correct: false },
                    { text: 'Reenviarlo a los proveedores.', correct: false },
                    { text: 'Revisarlo y actualizar el estado de las instalaciones.', correct: true }
                ],
                explanation: 'Tu responsabilidad es revisar y actualizar el listado para asegurar que los datos son reales.'
            },
            {
                id: 6,
                type: 'scenario',
                category: 'Facturación',
                question: 'Has recibido una factura de "Areo-Feu" por una revisión. Antes de tramitarla, ¿qué DEBES comprobar obligatoriamente?',
                options: [
                    { text: 'Que el importe sea bajo.', correct: false },
                    { text: 'Que incluya el certificado y el trabajo esté bien hecho.', correct: true },
                    { text: 'Que la haya aprobado Prevención primero.', correct: false }
                ],
                explanation: 'Como responsable del proyecto, debes dar tu conformidad al trabajo y verificar que adjuntan el certificado junto a la factura.'
            },
            {
                id: 7,
                type: 'scenario',
                category: 'Planificación',
                question: 'Tienes que solicitar una revisión a una empresa mantenedora. ¿Con cuánta antelación es preferible contactarles?',
                options: [
                    { text: 'El día de antes.', correct: false },
                    { text: 'Un mes antes.', correct: true },
                    { text: 'Cuando caduque la revisión.', correct: false }
                ],
                explanation: 'Lo ideal es contactar con un mes de antelación para asegurar que se realice dentro del plazo normativo.'
            },
            {
                id: 8,
                type: 'scenario',
                category: 'Auditoría',
                question: 'El técnico de prevención visita tu centro y te pide los certificados de revisión. Si te falta alguno, ¿qué ocurre?',
                options: [
                    { text: 'Nada, se pide después.', correct: false },
                    { text: 'Se anota como una INCIDENCIA / NO CONFORMIDAD.', correct: true },
                    { text: 'El técnico realiza la revisión en ese momento.', correct: false }
                ],
                explanation: 'La falta de certificados en una visita se registra formalmente como una No Conformidad en el informe de visita.'
            }
        ];

        // --- ESTADO GLOBAL ---
        let gameState = 'welcome'; // 'welcome', 'playing', 'result'
        let currentQuestionIndex = 0;
        let score = 0;
        let complianceLevel = 100;
        let showFeedback = false;
        let isCorrectLast = false;
        let selectedAnswerIndex = null;
        
        const appContainer = document.getElementById('app-container');

        // --- UTILIDADES ---

        // Función para obtener los SVG (icons from lucide-react, translated to inline SVG)
        const getIconSVG = (name, className = "w-6 h-6") => {
            const icons = {
                // CheckCircle
                'CheckCircle': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>',
                // AlertTriangle
                'AlertTriangle': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>',
                // XCircle
                'XCircle': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><circle cx="12" cy="12" r="10"/><path d="m15 9-6 6"/><path d="m9 9 6 6"/></svg>',
                // Clock (Frequency)
                'Clock': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
                // FileText
                'FileText': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>',
                // Award
                'Award': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>',
                // ArrowRight
                'ArrowRight': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>',
                // RefreshCcw
                'RefreshCcw': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>',
                // Shield (Scenario/Safety)
                'Shield': '<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="' + className + '"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
            };
            return icons[name] || '';
        };

        // Lógica de color para la barra de cumplimiento
        const getComplianceColor = () => {
            if (complianceLevel > 80) return 'bg-green-500';
            if (complianceLevel > 50) return 'bg-yellow-500';
            return 'bg-red-600';
        };

        // --- FUNCIONES DE MANEJO DE ESTADO ---

        const handleStart = () => {
            gameState = 'playing';
            score = 0;
            complianceLevel = 100;
            currentQuestionIndex = 0;
            showFeedback = false;
            render();
        };

        const handleAnswer = (isCorrect, index) => {
            if (showFeedback) return;

            selectedAnswerIndex = index;
            isCorrectLast = isCorrect;
            showFeedback = true;

            if (isCorrect) {
                score += 10;
            } else {
                complianceLevel = Math.max(0, complianceLevel - 15);
            }
            render();
        };

        const nextQuestion = () => {
            showFeedback = false;
            selectedAnswerIndex = null;
            
            if (currentQuestionIndex < QUIZ_DATA.length - 1) {
                currentQuestionIndex++;
                render();
            } else {
                gameState = 'result';
                render();
            }
        };

        // --- FUNCIONES DE RENDERIZADO ---

        const renderWelcomeScreen = () => {
            return `
                <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden animate-fade-in">
                    <div class="bg-blue-900 p-8 text-center">
                        <div class="mx-auto bg-white/10 w-20 h-20 rounded-full flex items-center justify-center mb-4 backdrop-blur-sm">
                            ${getIconSVG('FileText', 'w-10 h-10 text-white')}
                        </div>
                        <h1 class="text-2xl font-bold text-white mb-2">Revisiones Industriales</h1>
                        <p class="text-blue-100 text-sm">Módulo de Capacitación Interactiva</p>
                    </div>
                    <div class="p-8">
                        <p class="text-slate-600 mb-6 text-center leading-relaxed">
                            Como responsable en tu centro de trabajo, debes asegurar que todas las instalaciones cumplan con las <strong>revisiones periódicas y OCAs</strong>.
                        </p>
                        <div class="bg-blue-50 p-4 rounded-xl border border-blue-100 mb-6">
                            <h3 class="font-semibold text-blue-900 mb-2 flex items-center gap-2">
                                ${getIconSVG('Award', 'w-4 h-4')} Tu Misión:
                            </h3>
                            <ul class="text-sm text-blue-800 space-y-2">
                                <li class="flex gap-2">${getIconSVG('CheckCircle', 'w-4 h-4 mt-0.5')} Mantener el nivel de cumplimiento por encima del 50%.</li>
                                <li class="flex gap-2">${getIconSVG('CheckCircle', 'w-4 h-4 mt-0.5')} Gestionar facturas y certificados correctamente.</li>
                                <li class="flex gap-2">${getIconSVG('CheckCircle', 'w-4 h-4 mt-0.5')} Conocer las frecuencias de revisión.</li>
                            </ul>
                        </div>
                        <button 
                            onclick="handleStart()"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2"
                        >
                            Comenzar Formación ${getIconSVG('ArrowRight', 'w-5 h-5')}
                        </button>
                    </div>
                </div>
            `;
        };

        const renderGameplayScreen = () => {
            const currentQuestion = QUIZ_DATA[currentQuestionIndex];
            const isFrequency = currentQuestion.type === 'frequency';
            const complianceColor = getComplianceColor();

            // Status Bar
            let html = `
                <div class="max-w-md w-full animate-fade-in">
                    <div class="bg-white rounded-xl shadow-sm p-4 mb-4 flex justify-between items-center">
                        <div>
                            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider">Progreso</p>
                            <p class="font-bold text-slate-700">${currentQuestionIndex + 1} / ${QUIZ_DATA.length}</p>
                        </div>
                        <div class="text-right w-1/2">
                            <p class="text-xs text-slate-400 font-semibold uppercase tracking-wider mb-1">Nivel de Cumplimiento</p>
                            <div class="h-3 w-full bg-slate-100 rounded-full overflow-hidden">
                                <div 
                                    class="h-full transition-all duration-500 ${complianceColor}" 
                                    style="width: ${complianceLevel}%"
                                ></div>
                            </div>
                        </div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white rounded-2xl shadow-xl overflow-hidden relative">
                        <!-- Category Tag -->
                        <div class="absolute top-0 right-0 bg-slate-100 px-4 py-2 rounded-bl-xl text-xs font-bold text-slate-500 uppercase tracking-wide">
                            ${currentQuestion.category}
                        </div>

                        <div class="p-8 pb-4">
                            <div class="inline-block p-2 rounded-lg bg-blue-50 text-blue-600 mb-4">
                                ${isFrequency ? getIconSVG('Clock') : getIconSVG('Shield')}
                            </div>
                            <h2 class="text-xl font-bold text-slate-800 leading-snug mb-2">
                                ${currentQuestion.question}
                            </h2>
                        </div>

                        <div class="p-4 bg-slate-50 space-y-3">
            `;
            
            // Options
            currentQuestion.options.forEach((option, idx) => {
                let btnClass = "w-full p-4 rounded-xl text-left text-sm font-medium transition-all border-2 ";
                let iconHtml = '';

                if (showFeedback) {
                    if (option.correct) {
                        btnClass += "bg-green-100 border-green-500 text-green-800";
                        iconHtml = getIconSVG('CheckCircle', 'w-5 h-5 text-green-600');
                    } else if (idx === selectedAnswerIndex && !option.correct) {
                        btnClass += "bg-red-50 border-red-200 text-red-800 opacity-60";
                        iconHtml = getIconSVG('XCircle', 'w-5 h-5 text-red-500');
                    } else {
                        btnClass += "bg-white border-transparent opacity-40";
                    }
                } else {
                    btnClass += "bg-white border-transparent hover:border-blue-300 shadow-sm hover:shadow-md text-slate-700";
                }

                html += `
                    <button
                        ${showFeedback ? 'disabled' : ''}
                        onclick="handleAnswer(${option.correct}, ${idx})"
                        class="${btnClass}"
                    >
                        <div class="flex items-center justify-between">
                            ${option.text}
                            ${iconHtml}
                        </div>
                    </button>
                `;
            });

            html += `
                        </div>

                        <!-- Feedback Panel -->
                        ${showFeedback ? `
                            <div class="bg-blue-900 text-white p-6 animate-slide-up">
                                <div class="flex items-start gap-3 mb-4">
                                    ${isCorrectLast ? 
                                        `<div class="bg-green-500 p-1 rounded-full">${getIconSVG('CheckCircle', 'w-5 h-5 text-white')}</div>` : 
                                        `<div class="bg-red-500 p-1 rounded-full">${getIconSVG('AlertTriangle', 'w-5 h-5 text-white')}</div>`
                                    }
                                    <div>
                                        <p class="font-bold text-lg mb-1">${isCorrectLast ? '¡Correcto!' : 'Atención'}</p>
                                        <p class="text-blue-100 text-sm leading-relaxed">${currentQuestion.explanation}</p>
                                    </div>
                                </div>
                                <button 
                                    onclick="nextQuestion()"
                                    class="w-full bg-white text-blue-900 font-bold py-3 rounded-lg hover:bg-blue-50 transition-colors"
                                >
                                    Continuar
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            return html;
        };

        const renderResultScreen = () => {
            const isExcellent = complianceLevel > 80;
            const iconHtml = isExcellent 
                ? `<div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center animate-bounce-small">${getIconSVG('Award', 'w-12 h-12 text-green-600')}</div>` 
                : `<div class="w-24 h-24 bg-yellow-100 rounded-full flex items-center justify-center">${getIconSVG('AlertTriangle', 'w-12 h-12 text-yellow-600')}</div>`;
            const message = isExcellent 
                ? '¡Excelente! Tu centro de trabajo cumple con todas las normativas de revisión. Estás listo para gestionar la seguridad.'
                : 'Has completado el módulo, pero tu nivel de cumplimiento es bajo. Te recomendamos revisar el material de "Revisiones Industriales" nuevamente para evitar No Conformidades.';
            const complianceColor = isExcellent ? 'text-green-600' : 'text-red-500';

            return `
                <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden animate-fade-in text-center p-8">
                    <div class="mb-6 flex justify-center">
                        ${iconHtml}
                    </div>
                    
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Formación Completada</h2>
                    
                    <div class="grid grid-cols-2 gap-4 mb-8 mt-6">
                        <div class="bg-slate-50 p-4 rounded-xl">
                            <p class="text-xs text-slate-400 uppercase font-bold">Puntuación</p>
                            <p class="text-2xl font-bold text-blue-600">${score} pts</p>
                        </div>
                        <div class="bg-slate-50 p-4 rounded-xl">
                            <p class="text-xs text-slate-400 uppercase font-bold">Cumplimiento</p>
                            <p class="text-2xl font-bold ${complianceColor}">
                                ${complianceLevel}%
                            </p>
                        </div>
                    </div>

                    <p class="text-slate-600 mb-8">${message}</p>

                    <button 
                        onclick="handleStart()"
                        class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-4 rounded-xl shadow-lg flex items-center justify-center gap-2 transition-all"
                    >
                        ${getIconSVG('RefreshCcw', 'w-4 h-4')} Repetir Módulo
                    </button>
                </div>
            `;
        };


        // --- FUNCIÓN PRINCIPAL DE RENDERIZADO ---
        const render = () => {
            let content = '';
            switch (gameState) {
                case 'welcome':
                    content = renderWelcomeScreen();
                    break;
                case 'playing':
                    content = renderGameplayScreen();
                    break;
                case 'result':
                    content = renderResultScreen();
                    break;
            }
            appContainer.innerHTML = content;
        };

        // Iniciar la aplicación al cargar la ventana
        window.onload = render;

    </script>
</body>
</html>
